<title>Banco d'asta</title>
<style>
:root{--ink:#0E141A;--panel:#151F27;--panel2:#1B2831;--line:#2A3B47;--rosa:#F2A7B3;--cream:#EDE8E2;
--mut:#8CA0AF;--mint:#57D9A3;--amber:#F5B851;--red:#FF6B6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h3{font-family:'Archivo Black','Arial Black',Impact,sans-serif;letter-spacing:-.02em;margin:0;text-transform:uppercase}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:330px minmax(0,1fr);height:100vh;height:100dvh;max-width:100vw;overflow:hidden}
.shell.solo{grid-template-columns:1fr}   /* prima di aprire l'asta il listone non esiste */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;background:#111922}
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.mainScroll{overflow-y:auto;overflow-x:hidden;padding:14px 18px 40px;flex:1;min-width:0}
@media(max-width:900px){.shell{grid-template-columns:1fr}
 .side{position:fixed;inset:0;z-index:50;display:none}.side.open{display:flex}
 .sideToggle{display:inline-flex!important}}
.sideToggle{display:none}

.sHead{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);min-width:0}
.sHead .pill{white-space:nowrap}
.sList{overflow-y:auto;overflow-x:hidden;flex:1;padding:0 14px 30px;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px}.brand h1{font-size:17px}
.brand span{font-size:9px;letter-spacing:.16em;color:var(--rosa)}
nav{display:flex;gap:6px;overflow-x:auto;flex:1}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--mut);padding:7px 13px;
border-radius:999px;font-size:12.5px;font-weight:600;font-family:inherit}
nav button.on{background:var(--rosa);border-color:var(--rosa);color:#12181D}
.cash{text-align:right;line-height:1.1}.cash b{font-family:ui-monospace,Menlo,monospace;font-size:21px}
.cash small{display:block;font-size:9px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;letter-spacing:.1em;color:var(--rosa);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.grid2>*{min-width:0}          /* senza questo una colonna larga sfonda la griglia */
.card,.block{max-width:100%;overflow-wrap:anywhere}
.btn,.mini{white-space:normal}  /* le etichette lunghe vanno a capo, non deborda il pulsante */
pre{max-width:100%;overflow-x:auto}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:5px}
.fld{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--cream);border-radius:9px;
padding:9px 11px;font-size:16px;font-family:inherit}
.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.btn{background:var(--rosa);color:#12181D;border:none;border-radius:10px;padding:12px 14px;font-weight:600;
font-size:14px;width:100%;font-family:inherit}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--cream)}
.btn.mint{background:var(--mint)}.btn:disabled{opacity:.45}
.mini{border:1px solid var(--line);background:var(--panel2);color:var(--cream);border-radius:8px;padding:6px 9px;
font-size:12px;font-weight:600;font-family:inherit}
.mini.on{background:var(--rosa);color:#12181D;border-color:var(--rosa)}
.pill{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
padding:3px 7px;border-radius:6px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
.pill.P{color:#F5B851;border-color:#4a3d22}.pill.D{color:#79C0FF;border-color:#22384a}
.pill.C{color:#57D9A3;border-color:#1f4437}.pill.A{color:#FF8FA0;border-color:#4a2530}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 8px}
.t3{background:var(--mint)}.t2{background:var(--amber)}.t1{background:var(--red)}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow small{font-size:11px;color:var(--mut)}
.prow.sold{opacity:.45}
.prow.selected{background:rgba(242,167,179,.10);border-radius:8px;padding-left:6px;padding-right:6px}
.qq{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px}
.tick{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 0;
border-bottom:1px solid var(--line)}.tick:last-child{border-bottom:none}
.bar{display:flex;height:24px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.bar span{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#0E141A;
font-family:ui-monospace,Menlo,monospace}
.bar2{display:flex;height:7px;margin-top:3px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.block{background:linear-gradient(160deg,#1B2831,#131C24);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.bname{font-family:'Archivo Black','Arial Black',Impact,sans-serif;font-size:22px;text-transform:uppercase;line-height:1.05}
.rail{position:relative;height:40px;margin:14px 0 4px;border-radius:8px;background:var(--panel);
border:1px solid var(--line);overflow:hidden}
.rail i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1f4437,#57D9A3);opacity:.28}
.rail b{position:absolute;top:0;bottom:0;width:2px;background:var(--rosa)}
.rail s{position:absolute;top:5px;font-size:9px;letter-spacing:.08em;color:var(--mut);text-decoration:none}
.bigno{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:50px;line-height:1;letter-spacing:-.04em}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-top:10px}
.trio div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.trio b{display:block;font-family:ui-monospace,Menlo,monospace;font-size:19px}
.trio small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-top:8px}
.warn{background:#2a1f14;border:1px solid #4a3d22;color:#F5B851;border-radius:9px;padding:9px 11px;font-size:12.5px;line-height:1.5;margin-bottom:8px}
.warn.hi{background:#331a1a;border-color:#5a2a2a;color:#FF9E9E}
.agent{border-left:2px solid var(--rosa);padding:2px 0 2px 11px;margin:9px 0;font-size:14px;line-height:1.55}
.agent em{color:var(--rosa);font-style:normal;font-weight:600;font-size:11px;letter-spacing:.08em;
text-transform:uppercase;display:block;margin-bottom:3px}

/* campo */
.pitch{position:relative;background:linear-gradient(180deg,#16302a,#102420);border:1px solid #24483f;
border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;justify-content:space-between;
min-height:430px;background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.03) 0 40px,transparent 40px 80px)}
.prow2{display:flex;justify-content:space-evenly;gap:6px}
.slot{width:82px;height:62px;border:1px dashed #3d6b5e;border-radius:10px;background:rgba(0,0,0,.25);
display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#8fc3b3;
text-align:center;padding:3px;overflow:hidden}
.slot.full{border-style:solid;border-color:var(--mint);background:rgba(87,217,163,.14);color:var(--cream)}
.slot.hover{border-color:var(--rosa);background:rgba(242,167,179,.18)}
.slot b{font-size:11px;line-height:1.15;display:block;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot small{font-size:9px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
border-radius:9px;padding:6px 9px;font-size:12px;margin:0 6px 6px 0;touch-action:none}
.chip.sel{border-color:var(--rosa);background:rgba(242,167,179,.15)}
.ghost{position:fixed;z-index:99;pointer-events:none;opacity:.9;transform:translate(-50%,-50%)}
/* chat */
.chatWrap{display:flex;flex-direction:column;height:calc(100vh - 130px);height:calc(100dvh - 130px)}
.chatList{flex:1;overflow:auto;padding-right:4px}
.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin-bottom:10px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg.u{background:var(--rosa);color:#12181D;margin-left:auto;border-bottom-right-radius:4px}
.msg.a{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--rosa);
border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.startBar{background:linear-gradient(90deg,rgba(242,167,179,.18),transparent);border:1px solid var(--rosa);
border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px;line-height:1.5}
.hide{display:none}

const crB = x => Math.max(1, Math.round(x));

function parseRawB(raw){
  const out = [];
  raw.split("\n").forEach((line, i) => {
    line = line.trim(); if(!line) return;
    const c = line.split("|"); if(c.length < 4) return;
    out.push({id:"p"+i, r:c[0].trim().toUpperCase(), nome:c[1].trim(), team:c[2].trim(),
      q:parseInt(c[3])||1, fvm:c[4]?parseInt(c[4])||0:0, t:c[5]?parseInt(c[5])||2:2});
  });
  return out;
}
function assignTiersB(players){
  const out = [];
  ROLES.forEach(r => {
    const arr = players.filter(p=>p.r===r).sort((a,b)=>(b.fvm||b.q)-(a.fvm||a.q));
    const n = Math.max(1, arr.length-1);
    arr.forEach((p,i) => {
      const pc = i/n;
      out.push(Object.assign({}, p, {tier: pc<=.06?"Big":pc<=.18?"Semi":pc<=.45?"Titolare":pc<=.75?"Low":"Slot"}));
    });
  });
  return out;
}

/* I contatori si ricavano SEMPRE dagli acquisti: niente disallineamenti. */
function syncPartsB(){
  if(!ST.parts) return;
  const cfg = ST.cfg;
  ST.parts.forEach(pt => { pt.credits = cfg.budget;
    pt.filled = {P:0,D:0,C:0,A:0}; pt.spent = {P:0,D:0,C:0,A:0}; });
  Object.keys(ST.sold).forEach(pid => {
    const s = ST.sold[pid], p = ST.players.find(x=>x.id===pid);
    if(!p || typeof s.buyer !== "number" || s.buyer >= ST.parts.length){ delete ST.sold[pid]; return; }
    const pt = ST.parts[s.buyer];
    pt.credits -= s.price; pt.filled[p.r]++; pt.spent[p.r] += s.price;
  });
  const miei = new Set(Object.keys(ST.sold).filter(k=>ST.sold[k].buyer===0));
  const f = ST.formation || {modulo:"3-4-3", slots:{}};
  const ns = {}; Object.keys(f.slots||{}).forEach(k=>{ if(miei.has(f.slots[k])) ns[k]=f.slots[k]; });
  f.slots = ns; ST.formation = f;
}

/* ---------------- MOTORE ---------------- */
function engineB(){
  const cfg = ST.cfg, parts = ST.parts, players = ST.players;
  const avail = players.filter(p=>!ST.sold[p.id]);
  const totalCredits = parts.reduce((s,p)=>s+p.credits,0);
  const slotsLeft = {};
  ROLES.forEach(r => slotsLeft[r] = parts.reduce((s,p)=>s+Math.max(0,cfg.slots[r]-(p.filled[r]||0)),0));

  let pool = [];
  ROLES.forEach(r => { pool = pool.concat(
    avail.filter(p=>p.r===r).sort((a,b)=>(b.fvm||b.q)-(a.fvm||a.q)).slice(0,slotsLeft[r])); });

  // FVM = fantavalore di mercato: incorpora gia' titolarita' e ruolo, non va concentrato oltre
  const rawOf = p => (p.fvm || (p.q*TIERM[p.tier]*(TITM[p.t]||0.72)*4));
  const rawSum = pool.reduce((s,p)=>s+rawOf(p),0) || 1;
  const slotsTot = ROLES.reduce((s,r)=>s+slotsLeft[r],0);
  const free = Math.max(0, totalCredits - slotsTot);
  const price = p => crB(1 + free*rawOf(p)/rawSum);

  let full = [];
  ROLES.forEach(r => { full = full.concat(
    players.filter(p=>p.r===r).sort((a,b)=>(b.fvm||b.q)-(a.fvm||a.q)).slice(0,cfg.slots[r]*cfg.teams)); });
  const ref = (cfg.budget*cfg.teams)/(full.reduce((s,p)=>s+p.q,0)||1);
  const now = totalCredits/(pool.reduce((s,p)=>s+p.q,0)||1);
  const factor = ref ? now/ref : 1;

  const marginal = {};
  ROLES.forEach(r => { const a = pool.filter(p=>p.r===r); marginal[r] = a.length ? price(a[a.length-1]) : 1; });

  const caps = parts.map((pt,i) => {
    const left = ROLES.reduce((s,r)=>s+Math.max(0,cfg.slots[r]-(pt.filled[r]||0)),0);
    return {i:i, name:pt.name, credits:pt.credits, left:left,
      cap:Math.max(1, pt.credits-Math.max(0,left-1)),
      medio: left ? Math.round(pt.credits/left*10)/10 : 0, filled:pt.filled,
      scoperti: ROLES.filter(r=>(pt.filled[r]||0)<cfg.slots[r])};
  });

  const me = parts[0];
  const mySlotsLeft = ROLES.reduce((s,r)=>s+cfg.slots[r],0) - ROLES.reduce((s,r)=>s+(me.filled[r]||0),0);
  const roleBudget={}, roleSpent={}, roleLeft={};
  ROLES.forEach(r => { roleBudget[r]=ST.alloc[r]/100*cfg.budget; roleSpent[r]=me.spent[r]||0;
    roleLeft[r]=roleBudget[r]-roleSpent[r]; });
  const flex = me.credits - ROLES.reduce((s,r)=>s+Math.max(0,roleLeft[r]),0);

  function evaluate(p){
    const base = price(p), r = p.r;
    const mine = Math.max(0, cfg.slots[r]-(me.filled[r]||0));
    const stars = ST.targets[p.id]||0;
    const boost = [1,1.08,1.18,1.32][stars];
    const sameTier = avail.filter(x=>x.r===r&&x.tier===p.tier).length;
    const needing = parts.filter(pt=>(pt.filled[r]||0)<cfg.slots[r]).length;
    const scarcity = clampB(needing/Math.max(1,sameTier), .6, 1.6);

    const rivals = caps.filter(c=>c.i!==0 && (c.filled[r]||0)<cfg.slots[r]);
    const topRival = rivals.length ? Math.max.apply(null, rivals.map(c=>c.cap)) : 0;
    const topName = rivals.length ? (rivals.find(c=>c.cap===topRival)||{}).name : null;
    const contenders = rivals.filter(c=>c.cap>=base).length;
    const pressure = clampB(.90+.04*contenders, .90, 1.15);

    const altri = ROLES.filter(r2=>r2!==r)
      .reduce((s,r2)=>s+Math.max(0,cfg.slots[r2]-(me.filled[r2]||0))*marginal[r2], 0);
    const riserva = Math.max(0,mine-1)*marginal[r];
    const affordHard = me.credits - altri - riserva;
    const affordRole = Math.max(0,roleLeft[r]) + Math.max(0,flex)*.55 - riserva;
    const ratio = clampB(affordRole/Math.max(1,base), .2, 3);

    const tit = p.t||2;
    const voglia = base*boost*(.88+.12*scarcity)*pressure*(TITC[tit]||0.9);
    const hardCap = me.credits - Math.max(0, mySlotsLeft-1);
    const beat = rivals.length ? topRival+1 : 1;
    let mx = Math.min(voglia, affordRole, affordHard, hardCap, beat);
    if(mine===0) mx = Math.min(mx,1);
    mx = crB(Math.max(1,mx));
    return {base:base, min:Math.min(crB(base*.72),mx), max:mx, tit:tit, tit_label:TITL[tit]||"",
      ratio:Math.round(ratio*100)/100, scarcity:scarcity, same_tier:sameTier, needing:needing,
      hard_cap:crB(hardCap), top_rival:topRival, top_rival_name:topName, contenders:contenders,
      rivals_count:rivals.length, beat:beat, mine_left:mine, stars:stars};
  }
  return {avail:avail, pool:pool, price:price, evaluate:evaluate, factor:factor, caps:caps, me:me,
    mySlotsLeft:mySlotsLeft, roleBudget:roleBudget, roleSpent:roleSpent, roleLeft:roleLeft,
    flex:flex, slotsLeft:slotsLeft, marginal:marginal};
}

function phaseB(e){
  for(const r of ROLES) if(e.slotsLeft[r] > 0) return r;
  return "A";
}
function alertsB(e){
  const out = [], cfg = ST.cfg;
  ROLES.forEach(r => {
    const tit = e.avail.filter(p=>p.r===r && p.t===3);
    const needing = e.caps.filter(c=>(c.filled[r]||0)<cfg.slots[r]).length;
    const mine = Math.max(0, cfg.slots[r]-(e.me.filled[r]||0));
    if(mine>0 && tit.length>0 && tit.length<=3){
      const best = tit.slice().sort((a,b)=>(b.fvm||b.q)-(a.fvm||a.q))[0];
      out.push({lvl: tit.length===1?"alto":"medio",
        txt:"Restano "+tit.length+" titolari tra i "+RNAME[r].toLowerCase()+" e "+needing+
            " squadre devono ancora comprarne. Il migliore libero è "+best.nome+" ("+best.team+"), prezzo "+e.price(best)+"."});
    }
    if(mine>0 && tit.length===0)
      out.push({lvl:"alto", txt:"Finiti i titolari tra i "+RNAME[r].toLowerCase()+
        ": da qui in poi si compra solo ballottaggio o riserva."});
  });
  const conteggio = {};
  Object.keys(ST.sold).forEach(k => {
    if(ST.sold[k].buyer!==0) return;
    const p = ST.players.find(x=>x.id===k); if(!p) return;
    conteggio[p.team] = (conteggio[p.team]||0)+1;
  });
  const top = Object.keys(conteggio).sort((a,b)=>conteggio[b]-conteggio[a])[0];
  if(top && conteggio[top]>=4)
    out.push({lvl:"medio", txt:"Hai "+conteggio[top]+" giocatori del "+top+
      ": un turnover o una giornata storta ti azzera mezza formazione."});
  return out;
}
function refPriceB(){
  const cfg = ST.cfg;
  let full = [];
  ROLES.forEach(r => { full = full.concat(
    ST.players.filter(p=>p.r===r).sort((a,b)=>(b.fvm||b.q)-(a.fvm||a.q)).slice(0,cfg.slots[r]*cfg.teams)); });
  const tot = full.reduce((s,p)=>s+(p.fvm||p.q*4),0) || 1;
  const slotsTot = ROLES.reduce((s,r)=>s+cfg.slots[r],0)*cfg.teams;
  const libero = Math.max(0, cfg.budget*cfg.teams - slotsTot);
  return p => 1 + libero*(p.fvm||p.q*4)/tot;
}
function pagelleB(e){
  const refp = refPriceB(), out = [];
  e.caps.forEach((c,i) => {
    const ids = Object.keys(ST.sold).filter(k=>ST.sold[k].buyer===i);
    const speso = ids.reduce((s,k)=>s+ST.sold[k].price, 0);
    let atteso = 0;
    ids.forEach(k => { const p = ST.players.find(x=>x.id===k); if(p) atteso += refp(p); });
    const idx = speso>0 ? atteso/speso : null;
    out.push({i:i, name:c.name, giocatori:ids.length, speso:speso, valore:Math.round(atteso),
      indice: idx ? Math.round(idx*100)/100 : null,
      giudizio: idx===null ? "" : (idx>=1.12 ? "sta comprando bene" : idx<=0.88 ? "sta pagando troppo" : "in linea col mercato")});
  });
  return out;
}
function alternativesB(bought, n){
  n = n || 5;
  const e = engineB(), cfg = ST.cfg;
  const mineLeft = {};
  ROLES.forEach(r => mineLeft[r] = Math.max(0, cfg.slots[r]-(e.me.filled[r]||0)));
  const fb = bought.fvm||bought.q;
  const same = e.avail.filter(x=>x.team===bought.team && x.r===bought.r)
    .sort((a,b)=>(b.fvm||b.q)-(a.fvm||a.q));
  const viceId = same.length ? same[0].id : null;
  const out = [];
  e.avail.forEach(p => {
    const r = p.r;
    if(mineLeft[r] <= 0) return;
    const ev = e.evaluate(p);
    if(ev.max < 1) return;
    const s1 = p.id===viceId ? 1 : ((p.team===bought.team && r===bought.r) ? 0.55 : 0);
    const fp = p.fvm||p.q;
    const s2 = (r===bought.r && p.team!==bought.team)
      ? Math.max(0, 1-Math.abs(fp-fb)/Math.max(fp,fb,1)) : 0;
    const s3 = mineLeft[r]/Math.max(1,cfg.slots[r]);
    const beat = Math.min(ev.beat, ev.base);
    const s4 = Math.max(0, (ev.base-beat)/Math.max(1,ev.base));
    const score = ALT_W_B[0]*s1 + ALT_W_B[1]*s2 + ALT_W_B[2]*s3 + ALT_W_B[3]*s4;
    let why;
    if(p.id===viceId) why = "eredita il posto di "+bought.nome+" al "+bought.team;
    else if(s1>0) why = "stesso reparto del "+bought.team;
    else if(s2>0.8) why = "stesso rendimento atteso di "+bought.nome+", prezzo simile";
    else if(s4>0.25) why = "pochi rivali possono spingerlo: lo chiudi a "+beat;
    else if(s3>0.6) why = RNAME[r].toLowerCase()+": il tuo reparto più scoperto";
    else why = "alternativa di pari fascia";
    out.push({id:p.id, nome:p.nome, team:p.team, r:r, tit:ev.tit_label, tit_n:ev.tit,
      base:ev.base, max:ev.max, why:why, score:score});
  });
  out.sort((a,b)=>b.score-a.score);
  return out.slice(0,n);
}

function importListoneB(text){
  const out = []; let k = 0;
  text.trim().split("\n").forEach(line => {
    const c = line.split(/[;,\t]/).map(x=>x.trim().replace(/^"|"$/g,""));
    if(c.length < 3) return;
    const ri = c.findIndex(x=>/^[PDCA]$/i.test(x)); if(ri < 0) return;
    const nomeI = c.findIndex((x,i)=>i>ri && x && isNaN(Number(x)) && x.length>2); if(nomeI < 0) return;
    const teamI = c.findIndex((x,i)=>i>nomeI && x && isNaN(Number(x)) && x.length>1);
    const nums = c.map((x,i)=>({n:Number(x),i:i})).filter(o=>o.i>ri && !isNaN(o.n) && o.n>0 && o.n<1200);
    if(!nums.length) return;
    out.push({id:"i"+(k++), r:c[ri].toUpperCase(), nome:c[nomeI], team:teamI>0?c[teamI]:"?",
      q:Math.round(nums[0].n), fvm:nums.length>3?Math.round(nums[3].n):0, t:2});
  });
  if(out.length > 20){
    ST.players = assignTiersB(out); ST.sold = {}; ST.targets = {};
    ST.formation = {modulo:"3-4-3", slots:{}};
    syncPartsB(); saveB(); return out.length;
  }
  return 0;
}

async function callClaudeB(system, messages, useSearch, maxTok){
  if(!ST.api_key) throw new Error("Nessuna chiave API salvata. L'asta funziona lo stesso: gli agenti sono un extra.");
  if(!navigator.onLine) throw new Error("Sei offline: gli agenti e la chat richiedono la rete. Il resto dell'app funziona.");
  const body = {model:"claude-sonnet-4-6", max_tokens:maxTok||1200, system:system, messages:messages};
  if(useSearch) body.tools = [{type:"web_search_20250305", name:"web_search"}];

    headers:{"content-type":"application/json", "x-api-key":ST.api_key,
      "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify(body)});
  if(!res.ok) throw new Error("L'API ha risposto "+res.status+". Controlla la chiave o la connessione.");
  const d = await res.json();
  return (d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

  body = body || {};
  switch(path){
    case "/api/state": return snapshotB();
    case "/api/config":
      Object.assign(ST.cfg, body.cfg||{});
      if(body.alloc) ST.alloc = body.alloc;
      if(body.preset) ST.preset = body.preset;
      saveB(); return {ok:true};
    case "/api/start":
      ST.parts = freshPartsB(); ST.sold = {};
      ST.formation = {modulo:"3-4-3", slots:{}};
      syncPartsB(); saveB(); return {ok:true};
    case "/api/assign": doAssignB(body.id, body.buyer, body.price); return {ok:true};
    case "/api/undo": doUndoB(body.id); return {ok:true};
    case "/api/target":
      ST.targets[body.id] = ((ST.targets[body.id]||0)+1)%4; saveB(); return {ok:true};
    case "/api/eval": {
      const e = engineB(), p = ST.players.find(x=>x.id===body.id);
      return {player:p, ev:e.evaluate(p)};
    }
    case "/api/alternatives": {
      const b = ST.players.find(x=>x.id===body.id);
      return {alts: b?alternativesB(b, body.n||5):[],
        bought: b?{nome:b.nome, team:b.team}:null};
    }
    case "/api/formation":
      ST.formation = {modulo:body.modulo||"3-4-3", slots:body.slots||{}};
      saveB(); return {ok:true};
    case "/api/key": ST.api_key = (body.key||"").trim(); saveB(); return {ok:true};
    case "/api/note": ST.note = body.note||""; saveB(); return {ok:true};
    case "/api/testkey": return await testKeyB();
    case "/api/import": return {n: importListoneB(body.text||"")};
    case "/api/chat":
      try{ return await agentChatB(body.msg||""); }
      catch(e){ return {errore: e.message}; }
    case "/api/agent":
      try{ return body.kind==="strategist" ? await agentStrategistB()
                                           : await agentScoutB(body.id, body.news); }
      catch(e){ return {errore: e.message}; }
    default: return {errore:"rotta sconosciuta: "+path};
  }
}

</script>

function viewMia(){

        (p?'<span class="dot t'+p.t+'"></span><b>'+esc(p.nome)+'</b><small>'+esc(p.team)+' · '+p.price+'</small>'
          :'<span style="opacity:.7">'+r+'</span>')+'</div>';

    h+='</div>';
  });
  h+='</div><div style="font-size:11.5px;color:var(--mut);margin-top:8px">'+

  (rose.length===0?'<div style="font-size:12.5px;color:var(--mut)">Non hai ancora nessun giocatore in rosa.</div>'
   :panca.length?panca.map(p=>'<span class="chip'+(selChip===p.id?' sel':'')+'" data-pid="'+p.id+'" onclick="tapChip(\''+p.id+'\')">'+
    '<span class="pill '+p.r+'" style="width:22px">'+p.r+'</span><span class="dot t'+p.t+'"></span>'+esc(p.nome)+

     const n=S.parts[0].filled[r]||0;

     '<span class="mono">'+S.role_spent[r]+' / '+S.role_budget[r]+'</span></div>';}).join("")+'</div>'+

   (S.flex>=0?'+':'')+S.flex+'</b></span></div></div></div>';
  return h+'</div>';
}
async function setModulo(m){
  S.formation.modulo=m; S.formation.slots={};
  await api("/api/formation",S.formation); await refresh();
}
async function place(pid,k){
  const f=S.formation;
  const r=k[0]; const p=(S.rose["0"]||[]).find(x=>x.id===pid);
  if(!p) return;
  if(p.r!==r){ alert(p.nome+" è "+RO[p.r]+": non può occupare quella casella."); return; }
  for(const kk in f.slots) if(f.slots[kk]===pid) delete f.slots[kk];
  f.slots[k]=pid; selChip=null;
  await api("/api/formation",f); await refresh();
}
async function clearSlot(k){
  delete S.formation.slots[k]; await api("/api/formation",S.formation); await refresh();
}
function tapChip(pid){ selChip=(selChip===pid?null:pid); render(); }
function tapSlot(k){
  if(selChip){ place(selChip,k); return; }
  if(S.formation.slots&&S.formation.slots[k]) clearSlot(k);
}
/* trascinamento con pointer events: funziona anche col dito su iPad */
function initDrag(){
  const bench=document.getElementById("bench"); if(!bench) return;
  bench.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("pointerdown",e=>{
      const pid=ch.dataset.pid; let ghost=null, moved=false;
      const move=ev2=>{
        if(!moved && Math.abs(ev2.clientY-e.clientY)+Math.abs(ev2.clientX-e.clientX)<6) return;
        moved=true;
        if(!ghost){ ghost=ch.cloneNode(true); ghost.className="chip ghost"; document.body.appendChild(ghost); }
        ghost.style.left=ev2.clientX+"px"; ghost.style.top=ev2.clientY+"px";
        document.querySelectorAll(".slot.hover").forEach(s=>s.classList.remove("hover"));
        const t=document.elementFromPoint(ev2.clientX,ev2.clientY);
        const sl=t&&t.closest?t.closest(".slot"):null; if(sl) sl.classList.add("hover");
      };
      const up=ev2=>{
        document.removeEventListener("pointermove",move);
        document.removeEventListener("pointerup",up);
        if(ghost) ghost.remove();
        document.querySelectorAll(".slot.hover").forEach(s=>s.classList.remove("hover"));
        if(!moved) return;
        const t=document.elementFromPoint(ev2.clientX,ev2.clientY);
        const sl=t&&t.closest?t.closest(".slot"):null;
        if(sl) place(pid,sl.dataset.slot);
      };
      document.addEventListener("pointermove",move);
      document.addEventListener("pointerup",up);
    });
  });
}

function copia(testo, id){
  const done=()=>{ const el=document.getElementById(id); if(el){ const old=el.textContent;
    el.textContent="copiato ✓"; setTimeout(()=>{el.textContent=old;},1600);} };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(testo).then(done, ()=>fallback(testo,done));
  } else fallback(testo,done);
}
function fallback(t,done){
  const ta=document.createElement("textarea");
  ta.value=t; ta.style.position="fixed"; ta.style.top="-1000px";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ alert("Copia manualmente il testo dal riquadro."); }
  ta.remove();
}

function slide(r,v){ v=+v;
  const o=R.filter(x=>x!==r), s=o.reduce((a,x)=>a+S.alloc[x],0)||1, rest=100-v;
  S.alloc[r]=v; o.forEach(x=>S.alloc[x]=Math.round(S.alloc[x]/s*rest)); S.preset="custom";
  R.forEach(x=>{const el=document.getElementById("al_"+x); if(el)el.textContent=Math.round(S.alloc[x]/100*S.cfg.budget)+"cr";});
  saveCfg();

  if(!S){ return; }
  if(!S.ready) tab="formato";
  const navAll=[["asta","Asta"],["squadre","Squadre"],["mia","La mia squadra"],["strategia","Strategia"],["chat","Consulente"],["formato","Formato"]];
  const nav = S.ready ? navAll : [["formato","Formato"]];
  const body = tab==="squadre"?viewSquadre() : tab==="mia"?viewMia() : tab==="strategia"?viewStrategia() :
               tab==="chat"?viewChat() : tab==="formato"?viewFormato() : viewAsta();
  const start = S.ready ? '' :
   '<div class="startBar"><b>Prima di cominciare:</b> controlla il formato della lega e i nomi dei partecipanti, '+
   'poi premi <b>Apri l\'asta</b> in fondo alla pagina. Da quel momento compare il listone a sinistra e il resto del menu.</div>';
  $("#app").innerHTML =
   '<div class="shell'+(S.ready?'':' solo')+'">'+
   (S.ready?'<aside class="side'+(sideOpen?' open':'')+'">'+listone()+'</aside>':'')+
   '<div class="main"><div class="topbar">'+
   '<div class="brand"><h1>Banco d\'asta</h1><span>v'+S.version+'</span></div>'+
   (S.ready?'<button class="mini sideToggle" onclick="sideOpen=true;render()">Listone</button>':'')+
   '<nav>'+nav.map(x=>'<button class="'+(tab===x[0]?'on':'')+'"'+
    ' onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join("")+'</nav>'+
   (S.ready?'<div class="cash"><b>'+S.parts[0].credits+'</b><small>crediti · '+S.my_slots_left+' slot</small></div>':'')+
   '</div><div class="mainScroll">'+start+body+'</div></div></div>';
  if(tab==="mia") initDrag();
  if(tab==="chat"){ const cl=$("#chatList"); if(cl) cl.scrollTop=cl.scrollHeight; }
}
refresh();
if("serviceWorker" in navigator){ window.addEventListener("load",function(){
  navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
</script></body></html>
